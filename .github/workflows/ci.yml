name: CI

# kiedy się uruchamia: przy pushu do main i przy każdym Pull Requeście
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # GitHub stawia czystą maszynę z Ubuntu
    runs-on: ubuntu-latest

#    dodanie bazy danych przed skryptami do ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${POSTGRES_USER}
          POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
          POSTGRES_DB: ${POSTGRES_DB}
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # wszystkie polecenia "run" wykonują się w tym folderze
    # (u Ciebie nazwa musi się zgadzać z folderem w repo, czyli teraz "beckend")
    defaults:
      run:
        working-directory: backend



    steps:
      # pobiera kod z repo na maszynę
      - uses: actions/checkout@v4

      # instaluje Pythona w tej samej wersji, co lokalnie
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/test/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r tests/requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: pytest
